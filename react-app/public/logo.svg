<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="50%" stop-color="#FF6A00" />
      <stop offset="100%" stop-color="#CC4400" />
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="innerBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF7ED" />
    </linearGradient>
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7E54" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25" flood-color="#000" />
    </filter>
  </defs>

  <!-- Outer Ring with Gold Border -->
  <circle cx="60" cy="60" r="56" fill="url(#innerBack)" stroke="url(#goldRing)" stroke-width="3" filter="url(#shadow)" />
  <circle cx="60" cy="60" r="50" fill="none" stroke="#FF9933" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.8" />

  <!-- Radiating Sun Aura -->
  <g opacity="0.15">
    <circle cx="60" cy="60" r="42" fill="#FF9933" />
  </g>

  <!-- Saffron & Green Lotus Flower -->
  <g transform="translate(60, 62) scale(0.92)">
    <!-- Base Green Leaves -->
    <path d="M-36 12 C-26 12 -12 18 0 20 C12 18 26 12 36 12 C28 22 14 26 0 26 C-14 26 -28 22 -36 12 Z" fill="url(#leafGrad)" />
    <path d="M-22 15 C-12 18 0 19 0 23 C0 19 12 18 22 15 C14 21 0 24 0 24 C0 24 -14 21 -22 15 Z" fill="#166534" opacity="0.6" />

    <!-- Outer Lower Saffron Petals -->
    <path d="M-34 4 C-38 -12 -24 -24 -14 -18 C-18 -8 -20 2 -26 10 C-30 8 -32 6 -34 4 Z" fill="url(#petalGrad)" opacity="0.9" />
    <path d="M34 4 C38 -12 24 -24 14 -18 C18 -8 20 2 26 10 C30 8 32 6 34 4 Z" fill="url(#petalGrad)" opacity="0.9" />

    <!-- Side Petals -->
    <path d="M-26 8 C-32 -8 -18 -30 -4 -20 C-9 -8 -11 4 -18 14 C-22 12 -24 10 -26 8 Z" fill="url(#crestGrad)" />
    <path d="M26 8 C32 -8 18 -30 4 -20 C9 -8 11 4 18 14 C22 12 24 10 26 8 Z" fill="url(#crestGrad)" />

    <!-- Central Inner Petals -->
    <path d="M-15 12 C-18 -12 -6 -36 0 -42 C6 -36 18 -12 15 12 C10 16 -10 16 -15 12 Z" fill="url(#petalGrad)" />
    
    <!-- Central Highlight Petal -->
    <path d="M-7 12 C-10 -6 0 -38 0 -42 C0 -38 10 -6 7 12 C4 14 -4 14 -7 12 Z" fill="#FFA366" />
    <path d="M0 -42 L0 14" stroke="#FFF7ED" stroke-width="1.2" opacity="0.6" />

    <!-- Center Stamen Glow -->
    <circle cx="0" cy="12" r="3" fill="#FBBF24" />
  </g>
</svg>